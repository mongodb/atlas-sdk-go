version: 2
updates:
  # Both modules share one dependency graph: bumping only the root breaks `make test-examples`.
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/examples"
    schedule:
      interval: weekly
      day: sunday
    # Wait 7 days on new releases before proposing them, so a compromised or broken
    # version has time to be caught. Security updates are never delayed. Set on every entry.
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "all"
    groups:
      gomod:
        patterns:
          - "*"
        # Without this, `directories` still opens one PR per directory, so a bump could land in
        # `/` while `/examples` keeps the old pin and `make test-examples` fails.
        group-by: dependency-name
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: sunday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/tools"
    schedule:
      interval: weekly
      day: sunday
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"
