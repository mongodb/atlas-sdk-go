---
name: CI
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Temporary validation for the SilkBomb ECR migration. Remove after this PR passes.
  silkbomb-ecr-access:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REGISTRY: 901841024863.dkr.ecr.us-east-1.amazonaws.com
      ECR_ROLE_ARN: arn:aws:iam::901841024863:role/ecr-role-gha-ro
      SILKBOMB_IMG: 901841024863.dkr.ecr.us-east-1.amazonaws.com/release-infrastructure/silkbomb:2.0
    steps:
      - name: Configure AWS credentials for DevProd Platforms ECR
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.ECR_ROLE_ARN }}
          aws-region: us-east-1
      - name: Pull and run SilkBomb from ECR
        run: |
          aws ecr get-login-password --region us-east-1 |
            docker login --username AWS --password-stdin "${ECR_REGISTRY}"
          docker pull "${SILKBOMB_IMG}"
          docker run --platform="linux/amd64" --rm "${SILKBOMB_IMG}" --help

  code-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false # see https://github.com/golangci/golangci-lint-action/issues/807
      - name: lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.11.4 # Also update GOLANGCI_VERSION variable in Makefile when updating this version
      - name: tests
        run: make test
      - name: example-tests
        run: make test-examples
  
  build:
    needs: code-health # only run if code-health passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ./tools/package-lock.json
      - working-directory: ./tools
        run: |
          npm install
          npm run ci
      - run: make install-goimports
      - working-directory: ./tools
        run: |
          export PATH=${PATH}:`go env GOPATH`/bin
          make clean_and_generate
      - name: Fail when generate introducing diff
        run: |
          git diff --exit-code
