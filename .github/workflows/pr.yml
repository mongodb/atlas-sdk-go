---
name: CI
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  code-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false # see https://github.com/golangci/golangci-lint-action/issues/807
      - name: lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.11.4 # Also update GOLANGCI_VERSION variable in Makefile when updating this version
      - name: tests
        run: make test
      - name: example-tests
        run: make test-examples
  
  build:
    needs: code-health # only run if code-health passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ./tools/package-lock.json
      - working-directory: ./tools
        run: |
          npm ci
          npm run ci
      - run: make install-goimports
      - working-directory: ./tools
        run: |
          export PATH=${PATH}:`go env GOPATH`/bin
          make clean_and_generate
      - name: Fail when generate introducing diff
        run: |
          git diff --exit-code

  compatibility:
    name: compatibility (Node 22.23.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false # see https://github.com/golangci/golangci-lint-action/issues/807
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # Declared floor (engines.node >= 22) and the downstream consumer
          # toolchain. Ships npm 10.9.8, so no npm pin is needed.
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: ./tools/package-lock.json
      - name: Run the full generation pipeline
        # Mirrors the downstream consumers, which run `make -e openapi-pipeline`
        # against their own specs. Needs Java (openapi-generator) and goimports,
        # not just `npm run ci`.
        run: |
          export PATH=${PATH}:`go env GOPATH`/bin
          make -e openapi-pipeline
      - name: Run the JavaScript tests and format check
        # Reuses the tools dependencies that the pipeline installed with npm ci,
        # so the JS regression tests also run on this toolchain.
        working-directory: ./tools
        run: npm run ci
