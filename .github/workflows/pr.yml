---
name: CI
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Generator changes (templates, transformer, generator version, spec) are
  # intentionally merged without regenerating admin/ to keep PRs reviewable;
  # the next APIBot PR picks up the regenerated code and drives the release.
  # For those changes we regenerate in CI and test against the regenerated code
  # instead of failing on the expected diff.
  changes:
    runs-on: ubuntu-latest
    outputs:
      generator: ${{ steps.detect.outputs.generator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect generator input changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base=""
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA}"
          elif [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            base="${PUSH_BEFORE_SHA}"
          fi

          generator=false
          if [ -n "${base}" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Files changed since ${base}:"
            git diff --name-only "${base}" HEAD | tee changed.txt
            if grep -qE '^(openapi/|tools/(config|transformer|scripts)/|tools/(package\.json|package-lock\.json|openapitools\.json|Makefile)$)' changed.txt; then
              generator=true
            fi
          else
            echo "No usable base commit; enforcing strict drift check."
          fi
          echo "generator=${generator}" | tee -a "$GITHUB_OUTPUT"

  code-health:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false # see https://github.com/golangci/golangci-lint-action/issues/807
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: needs.changes.outputs.generator == 'true'
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ./tools/package-lock.json
      - name: Regenerate SDK (generator inputs changed)
        if: needs.changes.outputs.generator == 'true'
        run: |
          make install-goimports
          PATH="${PATH}:$(go env GOPATH)/bin"; export PATH
          make -C tools clean_and_generate
      - name: lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.11.4 # Also update GOLANGCI_VERSION variable in Makefile when updating this version
      - name: tests
        run: make test
      - name: example-tests
        run: make test-examples

  build:
    needs: [changes, code-health] # only run if code-health passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ./tools/package-lock.json
      - working-directory: ./tools
        run: |
          npm ci
          npm run ci
      - run: make install-goimports
      - working-directory: ./tools
        run: |
          PATH="${PATH}:$(go env GOPATH)/bin"; export PATH
          make clean_and_generate
      - name: Fail when generate introducing diff
        if: needs.changes.outputs.generator != 'true'
        run: |
          git diff --exit-code
